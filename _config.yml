# Jekyll configuration for LLYXC.github.io
#
# Pages are self-contained HTML with `layout: null` and their own `permalink`,
# so no theme/layout is used. Jekyll's job here is just to emit each page at its
# clean permalink URL (e.g. /publications/).

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
