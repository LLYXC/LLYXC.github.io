# Jekyll configuration for LLYXC.github.io (served at luyangluo.com by GitHub Pages, built from master).
#
# No theme and no plugins. _layouts/ holds the shared page frame, _data/ the themes and the paper list,
# assets/ the styles, scripts and images. See README.md for what to edit and what is generated.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - docs
  - tools
  - assets/portrait-original.png
